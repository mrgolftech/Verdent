name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: Build Windows x64 executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/package
          go build -trimpath -ldflags="-s -w" -o dist/package/verdent.exe ./cmd/verdent
          cp .env.example dist/package/.env.example
          cp README.md dist/package/README.md

      - name: Create checksums and zip package
        run: |
          cd dist/package
          sha256sum verdent.exe > verdent.exe.sha256
          zip -9 ../verdent-windows-amd64.zip verdent.exe verdent.exe.sha256 .env.example README.md
          cd ..
          sha256sum verdent-windows-amd64.zip > verdent-windows-amd64.zip.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: verdent-windows-amd64
          path: |
            dist/package/verdent.exe
            dist/package/verdent.exe.sha256
            dist/verdent-windows-amd64.zip
            dist/verdent-windows-amd64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release tag
        id: release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${GITHUB_REF_NAME#release/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release assets
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; updating assets."
          else
            if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes --title "$RELEASE_TAG" --prerelease
            else
              gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG"
            fi
          fi
          gh release upload "$RELEASE_TAG" \
            dist/verdent-windows-amd64.zip \
            dist/verdent-windows-amd64.zip.sha256 \
            dist/package/verdent.exe \
            dist/package/verdent.exe.sha256 \
            --clobber
