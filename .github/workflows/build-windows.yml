name: build-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: Resolve build version
        id: build_version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            version="${GITHUB_REF_NAME#release/}"
          else
            version="${GITHUB_REF_NAME//\//-}+${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Windows x64 executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/windows
          go build -trimpath -ldflags="-s -w -X github.com/mrgolftech/Verdent/internal/server.Version=${{ steps.build_version.outputs.version }}" -o dist/windows/verdent.exe ./cmd/verdent
          cp .env.example dist/windows/.env.example
          cp README.md dist/windows/README.md

      - name: Build Ubuntu/Linux x64 executable
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/linux
          go build -trimpath -ldflags="-s -w -X github.com/mrgolftech/Verdent/internal/server.Version=${{ steps.build_version.outputs.version }}" -o dist/linux/verdent ./cmd/verdent
          chmod +x dist/linux/verdent
          cp .env.example dist/linux/.env.example
          cp README.md dist/linux/README.md

      - name: Create Windows package and checksums
        run: |
          cd dist/windows
          sha256sum verdent.exe > verdent.exe.sha256
          zip -9 ../verdent-windows-amd64.zip verdent.exe verdent.exe.sha256 .env.example README.md
          cd ..
          sha256sum verdent-windows-amd64.zip > verdent-windows-amd64.zip.sha256

      - name: Create Ubuntu/Linux package and checksums
        run: |
          cd dist/linux
          sha256sum verdent > verdent.sha256
          tar -czf ../verdent-linux-amd64.tar.gz verdent verdent.sha256 .env.example README.md
          cd ..
          sha256sum verdent-linux-amd64.tar.gz > verdent-linux-amd64.tar.gz.sha256

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: verdent-windows-amd64
          path: |
            dist/windows/verdent.exe
            dist/windows/verdent.exe.sha256
            dist/verdent-windows-amd64.zip
            dist/verdent-windows-amd64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Ubuntu/Linux workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: verdent-linux-amd64
          path: |
            dist/linux/verdent
            dist/linux/verdent.sha256
            dist/verdent-linux-amd64.tar.gz
            dist/verdent-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release tag
        id: release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${GITHUB_REF_NAME#release/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release assets
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; updating assets."
          else
            if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes --title "$RELEASE_TAG" --prerelease
            else
              gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG"
            fi
          fi
          gh release upload "$RELEASE_TAG" \
            dist/verdent-windows-amd64.zip \
            dist/verdent-windows-amd64.zip.sha256 \
            dist/windows/verdent.exe \
            dist/windows/verdent.exe.sha256 \
            dist/verdent-linux-amd64.tar.gz \
            dist/verdent-linux-amd64.tar.gz.sha256 \
            dist/linux/verdent \
            dist/linux/verdent.sha256 \
            --clobber
